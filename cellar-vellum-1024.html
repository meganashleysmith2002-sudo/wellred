<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>The Count</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600&family=Archivo+Black&family=Caveat:wght@600;700&display=swap');

:root{
  --red:#8c1c1c;
  --red-deep:#5e1212;
  --cream:#f6efe2;
  --cream-2:#efe4d1;
  --blush:#e8a4a0;
  --blush-soft:#f0c4c0;
  --gold:#c39536;
  --gold-lit:#e6bd63;
  --ink:#2a1712;
  --ink-soft:#6b544a;
  --night:#f6efe2;
  --on-night:#2a1712;
  --on-night-soft:#6b544a;
  --hair:rgba(42,23,18,.22);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:17px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding:0 0 64px;
  min-height:100vh;
}
.wrap{max-width:600px;margin:0 auto;padding:0 20px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--red)}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}

/* ---------- masthead ---------- */
.mast{position:relative;margin-bottom:26px}
.hero{position:relative;max-height:min(58vh,460px);overflow:hidden}
.hero img{display:block;width:100%;height:auto}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(246,239,226,0) 0%,
    rgba(246,239,226,.85) 78%,var(--cream) 100%)}

.lockup{text-align:center;margin-top:-6px}
.wordmark{font-family:'Archivo Black',sans-serif;text-transform:uppercase;
  letter-spacing:-.035em;line-height:.82;color:var(--ink);
  font-size:clamp(3.1rem,17vw,5.6rem)}
.wordmark b{color:var(--red);font-weight:400}
.founders{margin-top:12px;font-size:.72rem;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink)}
.founders i{font-family:'Caveat',cursive;font-style:normal;color:var(--red);
  font-size:1.25rem;vertical-align:-2px;margin:0 3px;letter-spacing:0}

.mast-rule{height:3px;background:var(--ink);border-radius:2px;margin:22px 0 20px}

.kick{font-family:'Caveat',cursive;font-size:1.55rem;color:var(--red);
  display:inline-block;transform:rotate(-3deg);margin:0 0 2px}
h1{font-family:'Archivo Black',sans-serif;text-transform:uppercase;color:var(--ink);
  letter-spacing:-.025em;line-height:.88;font-size:clamp(2.4rem,10.5vw,3.5rem);text-wrap:balance}
h1 i{color:var(--red);font-style:normal}
.sub{color:var(--ink-soft);margin-top:12px;font-size:.95rem}

/* ---------- section head ---------- */
.sec{margin-top:44px}
.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.sec-head h2{font-family:'Archivo Black',sans-serif;text-transform:uppercase;color:var(--on-night);
  letter-spacing:-.02em;line-height:.95;font-size:1.42rem}
.sec-line{flex:1;height:3px;background:var(--hair);border-radius:2px}
.sec-note{color:var(--on-night-soft);font-size:.88rem;margin-bottom:18px}

/* ---------- ballot cards ---------- */
.ballot{display:flex;flex-direction:column;gap:16px}
.card{perspective:1400px;min-height:214px}
@media (max-width:400px){.card{min-height:236px}}
.card-in{
  position:relative;width:100%;height:100%;min-height:inherit;
  transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.25,1);
}
.card.flipped .card-in{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:3px solid var(--ink);border-radius:4px 16px 16px 4px;
  background:var(--cream-2);color:var(--ink);
  box-shadow:5px 6px 0 rgba(42,23,18,.16);
  padding:15px 16px 15px 22px;overflow:hidden;
}
.face::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;
  background:var(--red);border-right:3px solid var(--ink)}
.card.mine .face{background:var(--blush-soft)}
.card.mine .face::before{background:var(--ink)}
.back{transform:rotateY(180deg);display:flex;flex-direction:column}

/* front */
.front{display:flex;gap:15px}
.cover{
  flex:none;width:112px;aspect-ratio:2/3;align-self:flex-start;
  border:2px solid var(--ink);
  border-radius:2px 5px 5px 2px;overflow:hidden;position:relative;
  background:var(--g,var(--red));display:flex;flex-direction:column;
  justify-content:flex-end;padding:9px 8px;
  box-shadow:2px 3px 0 rgba(42,23,18,.22);
}
@media (max-width:380px){.cover{width:96px}}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;
  background:linear-gradient(90deg,rgba(0,0,0,.34),rgba(0,0,0,0))}
.cov-t{font-family:'Archivo Black',sans-serif;text-transform:uppercase;
  font-size:.72rem;line-height:1.02;letter-spacing:-.01em;color:var(--cream);position:relative}
.cov-a{font-family:'Caveat',cursive;font-size:.98rem;line-height:1.1;
  color:rgba(246,239,226,.82);margin-top:5px;position:relative}
.cover.on-light .cov-t{color:var(--ink)}
.cover.on-light .cov-a{color:rgba(42,23,18,.72)}

.meta{flex:1;min-width:0;display:flex;flex-direction:column}
.bk-title{font-family:'Archivo Black',sans-serif;text-transform:uppercase;
  letter-spacing:-.02em;line-height:1.02;font-size:1.02rem}
.bk-author{font-family:'Caveat',cursive;font-size:1.25rem;color:var(--gold);margin-top:2px}

.bar{margin-top:10px;height:11px;border:2px solid var(--ink);border-radius:999px;
  background:var(--cream);overflow:hidden}
.bar span{display:block;height:100%;background:var(--red);width:0;
  transition:width .6s cubic-bezier(.2,.8,.25,1)}
.pct{margin-top:5px;font-size:.76rem;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pct b{color:var(--red);font-size:.95rem}

.acts{margin-top:auto;padding-top:11px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.vote{
  background:var(--red);color:var(--cream);font-family:'Archivo Black',sans-serif;
  text-transform:uppercase;font-size:.78rem;letter-spacing:.03em;
  border:2px solid var(--ink);border-radius:999px;padding:9px 17px;
  box-shadow:0 4px 0 rgba(42,23,18,.24);transition:transform .13s,box-shadow .13s;
}
.vote:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(42,23,18,.28)}
.vote:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(42,23,18,.24)}
.vote.picked{background:var(--ink);cursor:default}
.vote.picked:hover{transform:none;box-shadow:0 4px 0 rgba(42,23,18,.24)}
.flip{
  font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-soft);text-decoration:underline;text-underline-offset:4px;
}
.flip:hover{color:var(--red)}

/* back */
.back .bk-title{padding-right:4px}
.syn{margin-top:8px;font-size:.88rem;line-height:1.5;color:var(--ink);flex:1;overflow:auto}
.fable{
  display:inline-block;margin-top:6px;font-size:.75rem;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;color:var(--red);
  text-decoration:underline;text-underline-offset:4px;
}

/* ---------- totals ---------- */
.totals{margin-top:18px;display:flex;align-items:center;gap:10px;font-size:.8rem;
  letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--on-night-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold-lit);flex:none;
  box-shadow:0 0 10px 2px rgba(230,189,99,.55);
  animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}

/* ---------- nudge ---------- */
.nudge{margin-top:20px;border:3px solid var(--ink);border-radius:4px 18px 18px 4px;
  background:var(--cream-2);padding:20px 20px 22px;box-shadow:5px 6px 0 rgba(42,23,18,.14)}
.nudge-k{font-family:'Caveat',cursive;font-size:1.45rem;color:var(--red);
  transform:rotate(-2deg);display:inline-block}
.nudge p{margin-top:4px;color:var(--ink-soft);font-size:.92rem}
.nudge-btn{margin-top:14px;background:var(--red);color:var(--cream);
  font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:.85rem;
  border:3px solid var(--ink);border-radius:999px;padding:12px 22px;
  box-shadow:0 5px 0 rgba(42,23,18,.22);transition:transform .14s,box-shadow .14s}
.nudge-btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 rgba(42,23,18,.26)}
.nudge-btn:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(42,23,18,.22)}

/* ---------- photo plate ---------- */
.plate{position:relative;margin:34px calc(50% - 50vw) 0;width:100vw;
  border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);
  max-height:min(72vh,560px);overflow:hidden}
.plate img{width:100%;height:auto;display:block}
.plate::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52%;
  pointer-events:none;background:linear-gradient(180deg,rgba(26,12,10,0),rgba(26,12,10,.6))}
.plate-cap{position:absolute;left:0;right:0;bottom:10px;text-align:center;
  font-family:'Caveat',cursive;font-size:1.3rem;color:var(--cream);
  text-shadow:0 2px 10px rgba(0,0,0,.75)}

/* ---------- form ---------- */
.field{margin-top:22px}
.label{font-family:'Archivo Black',sans-serif;text-transform:uppercase;color:var(--on-night);
  font-size:.82rem;line-height:1.2;margin-bottom:9px}
.hint{color:var(--on-night-soft);font-size:.82rem;font-weight:400;
  font-family:'Archivo',sans-serif;text-transform:none;letter-spacing:0;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ink);border-radius:999px;padding:8px 15px;color:var(--ink);
  font-size:.86rem;font-weight:700;transition:background .14s,color .14s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
textarea,input[type="text"],input[type="email"]{
  width:100%;padding:13px 14px;font-family:inherit;font-size:1rem;
  background:var(--cream-2);border:3px solid var(--ink);border-radius:4px;
  color:var(--ink);line-height:1.5;
}
textarea:focus,input[type="text"]:focus,input[type="email"]:focus{border-color:var(--red)}
textarea{resize:vertical;min-height:80px}
textarea::placeholder,input::placeholder{color:rgba(107,84,74,.62)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:430px){.row2{grid-template-columns:1fr}}

.cta{margin-top:26px;width:100%;background:var(--red);color:var(--cream);
  font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:1.05rem;
  border:3px solid var(--ink);border-radius:999px;padding:16px 20px;
  box-shadow:0 8px 0 rgba(42,23,18,.22);transition:transform .14s,box-shadow .14s,opacity .14s}
.cta:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 0 rgba(42,23,18,.26)}
.cta:active:not(:disabled){transform:translateY(2px);box-shadow:0 5px 0 rgba(42,23,18,.22)}
.cta:disabled{opacity:.5;cursor:default}
.note{margin-top:16px;padding:14px 16px;border-left:4px solid var(--gold);
  background:var(--cream-2);font-size:.88rem;color:var(--ink-soft)}

/* ---------- done ---------- */
.done{border:3px solid var(--ink);border-radius:4px 18px 18px 4px;background:var(--cream-2);
  color:var(--ink);padding:24px 22px;margin-top:16px;position:relative;
  box-shadow:5px 7px 0 rgba(42,23,18,.16)}
.done .big{font-family:'Archivo Black',sans-serif;text-transform:uppercase;
  font-size:1.6rem;line-height:.95;letter-spacing:-.02em}
.done p{margin-top:10px;color:var(--ink-soft);font-size:.94rem}
.linky{font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--red);text-decoration:underline;text-underline-offset:4px;margin-top:14px;display:inline-block}

/* ---------- host dashboard ---------- */
.dash-mast{border-bottom:3px solid var(--ink);padding:30px 0 20px;margin-bottom:26px}
.brand-sm{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:1rem}
.brand-sm b{color:var(--red);font-weight:400}
.dash-mast .kick{margin-top:10px}
.dash-mast .sub{display:flex;align-items:center;gap:9px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{border:3px solid var(--ink);border-radius:4px 14px 14px 4px;background:var(--cream-2);
  padding:16px 16px 14px;box-shadow:4px 5px 0 rgba(42,23,18,.14)}
.tile-n{font-family:'Archivo Black',sans-serif;font-size:2.1rem;line-height:1;
  color:var(--red);font-variant-numeric:tabular-nums}
.tile-l{margin-top:4px;font-size:.72rem;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft)}
.panel{border:3px solid var(--ink);border-radius:4px 16px 16px 4px;background:var(--cream-2);
  padding:18px;box-shadow:4px 5px 0 rgba(42,23,18,.14);display:grid;gap:14px}
.panel-t{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:.9rem}
.bgrid{display:grid;gap:14px}
@media (min-width:640px){.bgrid{grid-template-columns:1fr 1fr}}
.mrow{display:grid;gap:5px}
.mrow-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mrow-l{font-size:.86rem;font-weight:700}
.mrow-n{font-size:.86rem;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.mbar{height:9px;border:2px solid var(--ink);border-radius:999px;background:var(--cream);overflow:hidden}
.mbar span{display:block;height:100%;background:var(--red);
  transition:width .5s cubic-bezier(.2,.8,.25,1)}
.mbar.big{height:13px}
.race{display:flex;align-items:center;gap:13px}
.race-cov{width:40px;height:60px;object-fit:cover;border:2px solid var(--ink);
  border-radius:2px 4px 4px 2px;flex:none}
.race-mid{flex:1;min-width:0;display:grid;gap:7px}
.race-t{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:.88rem;
  letter-spacing:-.01em}
.race-star{font-family:'Caveat',cursive;text-transform:none;letter-spacing:0;
  color:var(--red);font-size:1.15rem;margin-left:4px}
.race-n{flex:none;text-align:right;font-weight:900;color:var(--red);font-size:1.05rem;
  font-variant-numeric:tabular-nums}
.race-n small{display:block;font-weight:700;font-size:.68rem;letter-spacing:.08em;
  color:var(--ink-soft)}
.race.lead .mbar span{background:var(--red-deep)}
.empty{color:var(--ink-soft);font-size:.92rem}
.cards{display:grid;gap:14px}
@media (min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.voice{border:3px solid var(--ink);border-radius:4px 16px 16px 4px;background:var(--cream-2);
  padding:16px;box-shadow:4px 5px 0 rgba(42,23,18,.14)}
.voice .who{font-family:'Caveat',cursive;font-size:1.3rem;color:var(--red)}
.v-item{margin-top:9px;display:grid;gap:2px}
.v-l{font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-soft)}
.v-v{font-size:.92rem}
.dlrow{display:flex;flex-wrap:wrap;gap:10px;margin:34px 0 0}
.dl{border:2px solid var(--ink);border-radius:999px;padding:9px 17px;
  background:var(--cream-2);font-size:.8rem;font-weight:800;letter-spacing:.04em;
  text-transform:uppercase;color:var(--ink);
  box-shadow:0 4px 0 rgba(42,23,18,.18);transition:transform .13s,box-shadow .13s}
.dl:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(42,23,18,.22)}
.dl:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(42,23,18,.18)}

footer{margin-top:56px;padding-top:20px;border-top:3px solid var(--hair);
  font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--on-night-soft);
  font-weight:800;display:flex;justify-content:space-between;gap:12px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .card-in{transition:none}
}

.dl.danger{border-color:#8c1c1c;color:#8c1c1c}
</style>
</head>

      syn: "David Starr Jordan was a taxonomist, a man possessed with bringing order to the natural world. His specimen collections were demolished by lightning, by fire, and eventually by the 1906 San Francisco earthquake. In an instant, his life's work was shattered. He surveyed the wreckage at his feet, found the first fish that he recognized, and confidently began to rebuild. When NPR reporter Lulu Miller first heard this anecdote, she took Jordan for a fool. But as her own life slowly unraveled, she began to wonder about him. Part biography, part memoir, part scientific adventure: a dark and astonishing tale of love, chaos, scientific obsession, and possibly even murder.",

    var c={};
    fb.forEach(function(f){var v=f[key];if(v)c[v]=(c[v]||0)+1});
    var keys=order?order.filter(function(k){return c[k]}):Object.keys(c).sort(function(a,b){return c[b]-c[a]});
    return keys.map(function(k){return [k,c[k]]});
  }

  function render(data){
    lastData=data;
    var c=data.counts||{}, fb=data.feedback||[], t=total(c);
    var emails=fb.filter(function(f){return f.email}).length;
    var keen=fb.filter(function(f){return /yes/i.test(f.ticket||"")}).length;
    var h='<header class="dash-mast"><div class="wrap">';
    h+='<div class="brand-sm">Well<b>Red</b></div>';
    h+='<div class="kick">the count</div>';
    h+='<h1>How <i>tonight</i> is going</h1>';
    h+='<p class="sub"><span class="dot"></span>Refreshes every few seconds. Just for you and Kaitlyn.</p>';
    h+="</div></header><main class=\"wrap\">";

    h+='<div class="tiles">';
    [[t,t===1?"vote":"votes"],[fb.length,fb.length===1?"response":"responses"],
     [emails,"emails"],[keen,"keen on tickets"]].forEach(function(s){
      h+='<div class="tile"><div class="tile-n">'+s[0]+'</div><div class="tile-l">'+s[1]+"</div></div>";
    });
    h+="</div>";

    var ranked=BOOKS.slice().sort(function(a,b){return (c[b.id]||0)-(c[a.id]||0)});
    h+='<section class="sec"><div class="sec-head"><h2>The race</h2><span class="sec-line"></span></div><div class="panel">';
    ranked.forEach(function(b,i){
      var n=c[b.id]||0, pct=t?Math.round((n/t)*100):0, lead=i===0&&n>0;
      h+='<div class="race'+(lead?" lead":"")+'">';
      h+='<img class="race-cov" src="'+b.cover+'" alt="">';
      h+='<div class="race-mid"><div class="race-t">'+esc(b.short)
        +(lead?' <span class="race-star">&#9733; leading</span>':"")+"</div>";
      h+='<div class="mbar big"><span style="width:'+pct+'%"></span></div></div>';
      h+='<div class="race-n">'+pct+"%<small>"+n+"</small></div></div>";
    });
    if(!t)h+='<p class="empty">No votes yet. The second someone taps, this moves.</p>';
    h+="</div></section>";

    h+='<section class="sec"><div class="sec-head"><h2>Who&rsquo;s in the room</h2><span class="sec-line"></span></div>';
    if(!fb.length){h+='<div class="panel"><p class="empty">Responses land here as they&rsquo;re sent. Nothing yet.</p></div>';}
    else{
      h+='<div class="bgrid">';
      h+='<div class="panel"><h3 class="panel-t">Found us via</h3>'+tallyRows(countBy(fb,"found"),fb.length)+"</div>";
      h+='<div class="panel"><h3 class="panel-t">Age range</h3>'+tallyRows(countBy(fb,"age",AGES),fb.length)+"</div>";
      h+='<div class="panel"><h3 class="panel-t">Ticketed events</h3>'+tallyRows(countBy(fb,"ticket",TICKET),fb.length)+"</div>";
      h+='<div class="panel"><h3 class="panel-t">Fair price</h3>'+tallyRows(countBy(fb,"price",PRICE),fb.length)+"</div>";
      h+="</div>";
    }
    h+="</section>";

    h+='<section class="sec"><div class="sec-head"><h2>In their words</h2><span class="sec-line"></span></div>';
    if(!fb.length){h+='<div class="panel"><p class="empty">Names, emails, and what people voted for show up here.</p></div>';}
    else{
      h+='<div class="cards">';
      fb.slice().reverse().forEach(function(f){
        var who=[f.name,f.age,f.city].filter(Boolean).map(esc).join(" &middot; ");
        h+='<div class="voice"><div class="who">'+(who||"anonymous")+"</div>";
        [["Voted for",f.vote],["Loved",f.loved],["Would change",f.improve],["Looks for",f.lookfor],
         ["Venue idea",f.spot],["Book recs",f.books],["Activity ideas",f.activity],
         ["Email",f.email]].forEach(function(p){
          if(p[1])h+='<div class="v-item"><span class="v-l">'+p[0]+'</span><span class="v-v">'+esc(p[1])+"</span></div>";
        });
        h+="</div>";
      });
      h+="</div>";
    }
    h+="</section>";

    h+='<div class="dlrow">'
      +'<button class="dl" data-dl="responses">Download responses (CSV)</button>'
      +'<button class="dl" data-dl="votes">Download votes (CSV)</button>'
      +'<button class="dl danger" data-reset>Reset everything</button>'
      +"</div>";
    h+="</main>";
    h+='<footer class="wrap"><span>Well Red Club</span><span>host view</span></footer>';
    app.innerHTML=h;
    wire();
  }

  function csvCell(v){v=String(v==null?"":v);if(/^[=+\-@]/.test(v))v="'"+v;
    return '"'+v.replace(/"/g,'""')+'"';}
  function csvOf(rows){return rows.map(function(r){return r.map(csvCell).join(",")}).join("\r\n");}
  function buildCsv(kind){
    if(kind==="votes"){
      var rows=[["Book","Author","Votes"]];
      BOOKS.forEach(function(b){rows.push([b.title,b.author,lastData.counts[b.id]||0])});
      rows.push(["Total","",total(lastData.counts)]);
      return rows;
    }
    var cols=[["t","Submitted (UTC)"],["name","Name"],["city","City"],["email","Email"],["vote","Voted for"],
      ["age","Age range"],["found","Found us via"],["loved","Loved"],["improve","Would change"],
      ["lookfor","Looks for in a club"],["spot","Venue idea"],["books","Book recs"],
      ["ticket","Ticketed events"],["price","Fair price"],["activity","Activity ideas"]];
    var rows=[cols.map(function(c){return c[1]})];
    (lastData.feedback||[]).forEach(function(f){
      rows.push(cols.map(function(c){return f[c[0]]||""}));
    });
    return rows;
  }
  function download(name,text){
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"}));
    a.download=name;a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
  }

  var resetArmed=false;
  function wire(){
    app.querySelectorAll("[data-dl]").forEach(function(btn){
      btn.addEventListener("click",function(){
        var kind=btn.getAttribute("data-dl");
        download("wellred-"+kind+"-"+new Date().toISOString().slice(0,10)+".csv",
          csvOf(buildCsv(kind)));
      });
    });
    var rb=app.querySelector("[data-reset]");
    if(rb)rb.addEventListener("click",function(){
      if(!resetArmed){resetArmed=true;rb.textContent="Tap again to wipe all votes + responses";
        setTimeout(function(){resetArmed=false;
          if(rb.isConnected)rb.textContent="Reset everything";},4000);
        return;}
      resetArmed=false;
      fetch("/api/october",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:"reset",key:SECRET})}).then(refresh);
    });
  }

  function refresh(){
    if(!SECRET)return;
    fetch("/api/october?key="+encodeURIComponent(SECRET)).then(function(r){return r.json()})
      .then(function(j){ if(j&&j.error==="nope"){ SECRET=""; try{localStorage.removeItem("wr-host-key");}catch(e){} if(askKey()) refresh(); return; } render(j); }).catch(function(){});
  }
  refresh();
  setInterval(refresh,5000);

})();
</script>
</body>
</html>

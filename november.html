<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>WellRed November Ballot</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600&family=Archivo+Black&family=Caveat:wght@600;700&display=swap');

:root{
  --red:#8c1c1c;
  --red-deep:#5e1212;
  --cream:#f6efe2;
  --cream-2:#efe4d1;
  --blush:#e8a4a0;
  --blush-soft:#f0c4c0;
  --gold:#c39536;
  --gold-lit:#e6bd63;
  --ink:#2a1712;
  --ink-soft:#6b544a;
  --night:#f6efe2;
  --on-night:#2a1712;
  --on-night-soft:#6b544a;
  --hair:rgba(42,23,18,.22);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:17px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding:0 0 64px;
  min-height:100vh;
}
.wrap{max-width:600px;margin:0 auto;padding:0 20px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--red)}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}

/* ---------- masthead ---------- */
.mast,body>footer{max-width:760px;margin-left:auto;margin-right:auto}
.mast{position:relative;margin-bottom:26px}
.hero{position:relative;max-height:min(58vh,460px);overflow:hidden}
.hero img{display:block;width:100%;height:auto}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(246,239,226,0) 0%,
    rgba(246,239,226,.85) 78%,var(--cream) 100%)}

.lockup{text-align:center;margin-top:10px}
.wordmark{font-family:'Archivo Black',sans-serif;text-transform:uppercase;
  letter-spacing:.01em;line-height:1;color:var(--ink);
  font-size:clamp(2.3rem,12vw,4.4rem);white-space:nowrap;max-width:100%}
.wordmark b{color:var(--red);font-weight:400}
.founders{margin-top:18px;font-size:.72rem;font-weight:800;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink)}
.founders i{font-family:'Caveat',cursive;font-style:normal;color:var(--red);
  font-size:1.25rem;vertical-align:-2px;margin:0 3px;letter-spacing:0}

.mast-rule{height:3px;background:var(--ink);border-radius:2px;margin:30px 0 26px}

.kick{font-family:'Caveat',cursive;font-size:1.55rem;color:var(--red);
  display:inline-block;transform:rotate(-3deg);margin:0 0 2px}
h1{font-family:'Archivo Black',sans-serif;text-transform:uppercase;color:var(--ink);
  letter-spacing:-.025em;line-height:.88;font-size:clamp(2.2rem,9.5vw,3.3rem);text-wrap:balance;overflow-wrap:anywhere}
h1 i{color:var(--red);font-style:normal}
.sub{color:var(--ink-soft);margin-top:12px;font-size:.95rem}


/* ---------- save the date ---------- */
.std{margin-top:20px;border:3px solid var(--ink);border-radius:18px 4px 4px 18px;
  background:var(--ink);color:var(--cream);padding:22px 22px 24px;position:relative;overflow:hidden;
  box-shadow:5px 6px 0 rgba(42,23,18,.16)}
.std::after{content:"";position:absolute;right:0;top:0;bottom:0;width:9px;background:var(--red)}
.std-k{font-family:'Caveat',cursive;font-size:1.5rem;color:var(--blush);transform:rotate(-2deg);display:inline-block}
.std-date{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-.025em;
  line-height:.9;font-size:clamp(1.9rem,8.5vw,2.7rem);margin-top:6px;color:var(--cream)}
.std-date i{color:var(--gold-lit);font-style:normal}
.std-time{margin-top:10px;font-size:.8rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-lit)}
.std p{margin-top:12px;font-size:.95rem;color:rgba(246,239,226,.86);max-width:44ch}
.std-where{margin-top:14px;font-size:.88rem;color:var(--cream)}
.std-where b{display:block;font-weight:800}
.std-where a{color:var(--blush)}

/* ---------- vote confirmation ---------- */
.gotit{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:40px 20px 56px;max-width:600px;margin:0 auto}
.gotit .kick{margin-bottom:6px}
.gotit h1{font-size:clamp(2.6rem,12vw,4rem)}
.gotit-pick{display:flex;align-items:center;gap:16px;margin-top:22px;padding:14px 16px;border:3px solid var(--ink);border-radius:4px 14px 14px 4px;background:var(--blush-soft);box-shadow:5px 6px 0 rgba(42,23,18,.16)}
.gotit-pick img{width:56px;aspect-ratio:2/3;object-fit:cover;border:2px solid var(--ink);border-radius:2px 4px 4px 2px;flex:none}
.gotit-pick .gp-k{font-size:.7rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.gotit-pick .gp-t{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-.01em;line-height:1.05;font-size:1.05rem;margin-top:3px}
.gotit-pick .gp-a{font-family:'Caveat',cursive;font-size:1.05rem;color:var(--ink-soft);margin-top:2px}
.gotit .std{margin-top:24px}
.gotit-acts{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:26px}
.gotit-btn{background:var(--red);color:var(--cream);font-weight:800;font-size:.86rem;letter-spacing:.06em;text-transform:uppercase;
  padding:14px 22px;border-radius:999px;border:3px solid var(--ink);box-shadow:0 5px 0 rgba(42,23,18,.22)}
.gotit-btn:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(42,23,18,.22)}
.gotit-note{margin-top:18px;font-size:.85rem;color:var(--ink-soft)}

.gotit-form{margin-top:22px;border:3px solid var(--ink);border-radius:4px 16px 16px 4px;background:var(--cream-2);padding:18px 18px 20px;box-shadow:5px 6px 0 rgba(42,23,18,.16)}
.gotit-form .gf-k{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-.01em;font-size:1.05rem;line-height:1.05}
.gotit-form p{margin-top:6px;font-size:.88rem;color:var(--ink-soft)}
.gotit-form .gf-row{display:grid;gap:10px;margin-top:14px}
.gotit-form input{width:100%;font:inherit;font-size:1rem;padding:12px 14px;border:2px solid var(--ink);border-radius:10px;background:var(--cream);color:var(--ink)}
.gotit-form input:focus{outline:3px solid var(--red);outline-offset:2px}
.gotit-form .gf-btn{margin-top:12px;background:var(--ink);color:var(--cream);font-weight:800;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;padding:12px 20px;border-radius:999px;border:3px solid var(--ink)}
.gotit-form .gf-btn[disabled]{opacity:.6}
.gotit-form .gf-done{margin-top:12px;font-family:'Caveat',cursive;font-size:1.35rem;color:var(--red)}

/* ---------- section head ---------- */
.sec{margin-top:44px}
.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.sec-head h2{font-family:'Archivo Black',sans-serif;text-transform:uppercase;color:var(--on-night);
  letter-spacing:-.02em;line-height:.95;font-size:1.42rem}
.sec-line{flex:1;height:3px;background:var(--hair);border-radius:2px}
.sec-note{color:var(--on-night-soft);font-size:.88rem;margin-bottom:18px}

/* ---------- ballot cards ---------- */
.ballot{display:flex;flex-direction:column;gap:16px}
.card{perspective:1400px;min-height:250px}
@media (max-width:400px){.card{min-height:262px}}
.card-in{
  position:relative;width:100%;height:100%;min-height:inherit;
  transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.25,1);
}
.card.flipped .card-in{transform:rotateY(180deg)}
.card.flipped{min-height:372px}
@media (max-width:400px){.card.flipped{min-height:470px}}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:3px solid var(--ink);border-radius:4px 16px 16px 4px;
  background:var(--cream-2);color:var(--ink);
  box-shadow:5px 6px 0 rgba(42,23,18,.16);
  padding:15px 16px 15px 22px;overflow:hidden;
}
.face::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;
  background:var(--red);border-right:3px solid var(--ink)}
.card.mine .face{background:var(--blush-soft)}
.card.mine .face::before{background:var(--ink)}
.back{transform:rotateY(180deg);display:flex;flex-direction:column}

/* front */
.front{display:flex;gap:15px}
.cover{
  flex:none;width:136px;aspect-ratio:2/3;align-self:flex-start;
  border:2px solid var(--ink);
  border-radius:2px 5px 5px 2px;overflow:hidden;position:relative;
  background:var(--g,var(--red));display:flex;flex-direction:column;
  justify-content:flex-end;padding:9px 8px;
  box-shadow:2px 3px 0 rgba(42,23,18,.22);
}
@media (max-width:380px){.cover{width:112px}.flip,.vote.picked{white-space:nowrap}.vote.picked{font-size:.78rem}}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;
  background:linear-gradient(90deg,rgba(0,0,0,.34),rgba(0,0,0,0))}
.cov-t{font-family:'Archivo Black',sans-serif;text-transform:uppercase;
  font-size:.72rem;line-height:1.02;letter-spacing:-.01em;color:var(--cream);position:relative}
.cov-a{font-family:'Caveat',cursive;font-size:.98rem;line-height:1.1;
  color:rgba(246,239,226,.82);margin-top:5px;position:relative}
.cover.on-light .cov-t{color:var(--ink)}
.cover.on-light .cov-a{color:rgba(42,23,18,.72)}

.meta{flex:1;min-width:0;display:flex;flex-direction:column}
.bk-title{font-family:'Archivo Black',sans-serif;text-transform:uppercase;
  letter-spacing:-.02em;line-height:1.02;font-size:1.02rem}
.bk-author{font-family:'Caveat',cursive;font-size:1.25rem;color:var(--gold);margin-top:2px}

.bar{margin-top:10px;height:11px;border:2px solid var(--ink);border-radius:999px;
  background:var(--cream);overflow:hidden}
.bar span{display:block;height:100%;background:var(--red);width:0;
  transition:width .6s cubic-bezier(.2,.8,.25,1)}
.pct{margin-top:5px;font-size:.76rem;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pct b{color:var(--red);font-size:.95rem}

.acts{margin-top:auto;padding-top:11px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.vote{
  background:var(--red);color:var(--cream);font-family:'Archivo Black',sans-serif;
  text-transform:uppercase;font-size:.78rem;letter-spacing:.03em;
  border:2px solid var(--ink);border-radius:999px;padding:9px 17px;
  box-shadow:0 4px 0 rgba(42,23,18,.24);transition:transform .13s,box-shadow .13s;
}
.vote:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(42,23,18,.28)}
.vote:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(42,23,18,.24)}
.vote.picked{background:var(--ink);cursor:default}
.vote.picked:hover{transform:none;box-shadow:0 4px 0 rgba(42,23,18,.24)}
.flip{
  font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-soft);text-decoration:underline;text-underline-offset:4px;
}
.flip:hover{color:var(--red)}

.vibes{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.card{min-height:290px}
@media (max-width:400px){.card{min-height:300px}}
.cover{width:118px}
@media (max-width:380px){.cover{width:100px}}
.vibe{font-size:.6rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border:1.5px solid var(--ink);border-radius:999px;padding:2px 7px;white-space:nowrap;background:var(--cream);color:var(--ink);line-height:1.2}
.card.mine .vibe{background:var(--cream-2)}
.vibe.genre{background:var(--ink);color:var(--cream)}
/* back */
.back .bk-title{padding-right:4px}
.syn{margin-top:8px;font-size:.88rem;line-height:1.5;color:var(--ink);flex:1;overflow:auto}
.fable{
  display:inline-block;margin-top:6px;font-size:.75rem;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;color:var(--red);
  text-decoration:underline;text-underline-offset:4px;
}

/* ---------- totals ---------- */
.totals{margin-top:18px;display:flex;align-items:center;gap:10px;font-size:.8rem;
  letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--on-night-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold-lit);flex:none;
  box-shadow:0 0 10px 2px rgba(230,189,99,.55);
  animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}

/* ---------- nudge ---------- */
.nudge{margin-top:20px;border:3px solid var(--ink);border-radius:4px 18px 18px 4px;
  background:var(--cream-2);padding:20px 20px 22px;box-shadow:5px 6px 0 rgba(42,23,18,.14)}
.nudge-k{font-family:'Caveat',cursive;font-size:1.45rem;color:var(--red);
  transform:rotate(-2deg);display:inline-block}
.nudge p{margin-top:4px;color:var(--ink-soft);font-size:.92rem}
.nudge-btn{margin-top:14px;background:var(--red);color:var(--cream);
  font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:.85rem;
  border:3px solid var(--ink);border-radius:999px;padding:12px 22px;
  box-shadow:0 5px 0 rgba(42,23,18,.22);transition:transform .14s,box-shadow .14s}
.nudge-btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 rgba(42,23,18,.26)}
.nudge-btn:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(42,23,18,.22)}

/* ---------- photo plate ---------- */
.plate{position:relative;margin:34px -20px 0;
  border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);
  max-height:min(72vh,560px);overflow:hidden}
.plate img{width:100%;height:auto;display:block}
.plate::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52%;
  pointer-events:none;background:linear-gradient(180deg,rgba(26,12,10,0),rgba(26,12,10,.6))}
.plate-cap{position:absolute;left:0;right:0;bottom:10px;text-align:center;
  font-family:'Caveat',cursive;font-size:1.3rem;color:var(--cream);
  text-shadow:0 2px 10px rgba(0,0,0,.75)}

/* ---------- form ---------- */
.field{margin-top:22px}
.label{font-family:'Archivo Black',sans-serif;text-transform:uppercase;color:var(--on-night);
  font-size:.82rem;line-height:1.2;margin-bottom:9px}
.hint{color:var(--on-night-soft);font-size:.82rem;font-weight:400;
  font-family:'Archivo',sans-serif;text-transform:none;letter-spacing:0;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ink);border-radius:999px;padding:8px 15px;color:var(--ink);
  font-size:.86rem;font-weight:700;transition:background .14s,color .14s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
textarea,input[type="text"],input[type="email"]{
  width:100%;padding:13px 14px;font-family:inherit;font-size:1rem;
  background:var(--cream-2);border:3px solid var(--ink);border-radius:4px;
  color:var(--ink);line-height:1.5;
}
textarea:focus,input[type="text"]:focus,input[type="email"]:focus{border-color:var(--red)}
textarea{resize:vertical;min-height:80px}
textarea::placeholder,input::placeholder{color:rgba(107,84,74,.62)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:430px){.row2{grid-template-columns:1fr}}

.cta{margin-top:26px;width:100%;background:var(--red);color:var(--cream);
  font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:1.05rem;
  border:3px solid var(--ink);border-radius:999px;padding:16px 20px;
  box-shadow:0 8px 0 rgba(42,23,18,.22);transition:transform .14s,box-shadow .14s,opacity .14s}
.cta:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 0 rgba(42,23,18,.26)}
.cta:active:not(:disabled){transform:translateY(2px);box-shadow:0 5px 0 rgba(42,23,18,.22)}
.cta:disabled{opacity:.5;cursor:default}
.note{margin-top:16px;padding:14px 16px;border-left:4px solid var(--gold);
  background:var(--cream-2);font-size:.88rem;color:var(--ink-soft)}

/* ---------- thanks takeover ---------- */
.thanks{min-height:92vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:40px 24px 60px}
.thanks-script{width:min(340px,78vw);height:auto}
.thanks-cat{
  width:min(220px,60vw);border:3px solid var(--ink);border-radius:4px 14px 14px 4px;
  box-shadow:6px 7px 0 rgba(42,23,18,.16);transform:rotate(-2deg);margin-top:26px}
.thanks-sub{margin-top:26px;color:var(--ink-soft);font-size:.95rem;max-width:34ch}
.thanks .linky{margin-top:20px}

/* ---------- done ---------- */
.done{border:3px solid var(--ink);border-radius:4px 18px 18px 4px;background:var(--cream-2);
  color:var(--ink);padding:24px 22px;margin-top:16px;position:relative;
  box-shadow:5px 7px 0 rgba(42,23,18,.16)}
.done .big{font-family:'Archivo Black',sans-serif;text-transform:uppercase;
  font-size:1.6rem;line-height:.95;letter-spacing:-.02em}
.done p{margin-top:10px;color:var(--ink-soft);font-size:.94rem}
.linky{font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--red);text-decoration:underline;text-underline-offset:4px;margin-top:14px;display:inline-block}

/* ---------- host dashboard ---------- */
.dash-mast{border-bottom:3px solid var(--ink);padding:30px 0 20px;margin-bottom:26px}
.brand-sm{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:1rem}
.brand-sm b{color:var(--red);font-weight:400}
.dash-mast .kick{margin-top:10px}
.dash-mast .sub{display:flex;align-items:center;gap:9px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{border:3px solid var(--ink);border-radius:4px 14px 14px 4px;background:var(--cream-2);
  padding:16px 16px 14px;box-shadow:4px 5px 0 rgba(42,23,18,.14)}
.tile-n{font-family:'Archivo Black',sans-serif;font-size:2.1rem;line-height:1;
  color:var(--red);font-variant-numeric:tabular-nums}
.tile-l{margin-top:4px;font-size:.72rem;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft)}
.panel{border:3px solid var(--ink);border-radius:4px 16px 16px 4px;background:var(--cream-2);
  padding:18px;box-shadow:4px 5px 0 rgba(42,23,18,.14);display:grid;gap:14px}
.panel-t{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:.9rem}
.bgrid{display:grid;gap:14px}
@media (min-width:640px){.bgrid{grid-template-columns:1fr 1fr}}
.mrow{display:grid;gap:5px}
.mrow-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mrow-l{font-size:.86rem;font-weight:700}
.mrow-n{font-size:.86rem;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.mbar{height:9px;border:2px solid var(--ink);border-radius:999px;background:var(--cream);overflow:hidden}
.mbar span{display:block;height:100%;background:var(--red);
  transition:width .5s cubic-bezier(.2,.8,.25,1)}
.mbar.big{height:13px}
.race{display:flex;align-items:center;gap:13px}
.race-cov{width:40px;height:60px;object-fit:cover;border:2px solid var(--ink);
  border-radius:2px 4px 4px 2px;flex:none}
.race-mid{flex:1;min-width:0;display:grid;gap:7px}
.race-t{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:.88rem;
  letter-spacing:-.01em}
.race-star{font-family:'Caveat',cursive;text-transform:none;letter-spacing:0;
  color:var(--red);font-size:1.15rem;margin-left:4px}
.race-n{flex:none;text-align:right;font-weight:900;color:var(--red);font-size:1.05rem;
  font-variant-numeric:tabular-nums}
.race-n small{display:block;font-weight:700;font-size:.68rem;letter-spacing:.08em;
  color:var(--ink-soft)}
.race.lead .mbar span{background:var(--red-deep)}
.empty{color:var(--ink-soft);font-size:.92rem}
.cards{display:grid;gap:14px}
@media (min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.voice{border:3px solid var(--ink);border-radius:4px 16px 16px 4px;background:var(--cream-2);
  padding:16px;box-shadow:4px 5px 0 rgba(42,23,18,.14)}
.voice .who{font-family:'Caveat',cursive;font-size:1.3rem;color:var(--red)}
.v-item{margin-top:9px;display:grid;gap:2px}
.v-l{font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-soft)}
.v-v{font-size:.92rem}
.dlrow{display:flex;flex-wrap:wrap;gap:10px;margin:34px 0 0}
.dl{border:2px solid var(--ink);border-radius:999px;padding:9px 17px;
  background:var(--cream-2);font-size:.8rem;font-weight:800;letter-spacing:.04em;
  text-transform:uppercase;color:var(--ink);
  box-shadow:0 4px 0 rgba(42,23,18,.18);transition:transform .13s,box-shadow .13s}
.dl:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(42,23,18,.22)}
.dl:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(42,23,18,.18)}

footer{margin-top:56px;padding-top:20px;border-top:3px solid var(--hair);
  font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--on-night-soft);
  font-weight:800;display:flex;justify-content:space-between;gap:12px}


/* ---------- feedback form, card style ---------- */
#fbsec{counter-reset:q}
#fbsec .sec-head h2{font-size:1.6rem}
#fbsec .fb-kick{font-family:'Caveat',cursive;font-size:1.6rem;color:var(--red);display:inline-block;transform:rotate(-3deg);margin-bottom:2px}
#fbsec .field{position:relative;margin-top:16px;background:var(--cream-2);border:3px solid var(--ink);
  border-radius:4px 16px 16px 4px;padding:16px 16px 18px 24px;box-shadow:5px 6px 0 rgba(42,23,18,.14);overflow:hidden}
#fbsec .field::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--red);border-right:3px solid var(--ink)}
#fbsec .field.q > .label::before{counter-increment:q;content:counter(q,decimal-leading-zero);display:block;
  font-family:'Archivo Black',sans-serif;color:var(--red);font-size:.78rem;letter-spacing:.06em;margin-bottom:4px}
#fbsec .label{font-size:.95rem;line-height:1.15;margin-bottom:12px}
#fbsec .hint{margin-top:5px;font-size:.84rem}
#fbsec textarea,#fbsec input[type="text"],#fbsec input[type="email"]{background:var(--cream);border:2px solid var(--ink);border-radius:10px}
#fbsec textarea:focus,#fbsec input:focus{border-color:var(--red);outline:none;box-shadow:0 0 0 3px rgba(140,28,28,.18)}
#fbsec .chip{background:var(--cream);border-width:2px;padding:9px 15px;box-shadow:0 3px 0 rgba(42,23,18,.14);transition:background .14s,color .14s,transform .12s}
#fbsec .chip:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(42,23,18,.14)}
#fbsec .chip[aria-pressed="true"]{background:var(--red);border-color:var(--ink);color:var(--cream)}
#fbsec .sec-note{margin-bottom:4px}
#fbsec .free{background:var(--ink);color:var(--cream)}
#fbsec .free::before{background:var(--gold-lit)}
#fbsec .free .label,#fbsec .free .hint{color:var(--cream)}
#fbsec .free .chip{background:transparent;color:var(--cream);border-color:var(--cream);box-shadow:none}
#fbsec .free .chip[aria-pressed="true"]{background:var(--gold-lit);color:var(--ink);border-color:var(--gold-lit)}
#fbsec .free-k{font-family:'Caveat',cursive;font-size:1.45rem;color:var(--gold-lit);display:inline-block;transform:rotate(-2deg)}
#fbsec .free-t{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-.02em;line-height:.95;font-size:1.45rem;margin:4px 0 6px}
#fbsec .free p{color:rgba(246,239,226,.82);font-size:.9rem;margin-bottom:14px}
#fbsec .cta{margin-top:30px}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .card-in{transition:none}
}
</style>

  var SOURCES = ["Instagram", "TikTok", "A friend told me", "The venue", "Substack", "Fable", "Just wandered in"];
  var AGES = ["Under 21", "21\u201324", "25\u201329", "30\u201334", "35\u201344", "45+"];
  var NEXTACT = ["Pottery", "Candle making", "Painting", "Embroidery", "Something else"];
  var FREEEV = ["A hot girl walk", "Donation-based yoga or pilates", "Both", "Neither"];
  var DAYTIME = ["Saturday afternoon", "Saturday evening", "Sunday afternoon", "A weeknight"];
  var VOTE_KEY = "wellred_nov_vote", FB_KEY = "wellred_nov_fb";
  var app = document.getElementById("app");
  var flipped = {};

  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
  function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function read(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function post(payload){
    return fetch("/api/november",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)}).then(function(r){
        if(!r.ok) throw new Error("bad status");
        return r.json();
      });
  }

  var justSent = false;

  function fitWordmark(){
    var w=app.querySelector(".wordmark"); if(!w) return;
    var box=w.parentNode.clientWidth; if(!box) return;
    w.style.fontSize="";
    var size=parseFloat(getComputedStyle(w).fontSize);
    var probe=document.createElement("span"); probe.textContent=w.textContent; probe.style.cssText="position:absolute;visibility:hidden;white-space:nowrap;font:inherit;letter-spacing:inherit";
    w.appendChild(probe);
    for(var i=0;i<40 && probe.offsetWidth>box;i++){ size-=2; w.style.fontSize=size+"px"; }
    w.removeChild(probe);
  }
  window.addEventListener("resize",fitWordmark);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitWordmark);

  function stdBlock(){ return ""; }

  var justVoted = false;
  function renderGotIt(){
    var mine = read(VOTE_KEY), b = null;
    BOOKS.forEach(function(x){ if (x.id === mine) b = x; });
    var h = '<div class="gotit">';
    h += '<div class="kick">the november ballot</div>';
    h += '<h1>We got <i>your</i> vote</h1>';
    if (b) {
      h += '<div class="gotit-pick"><img src="'+b.cover+'" alt=""><div>'
        + '<div class="gp-k">You picked</div><div class="gp-t">'+esc(b.title)+'</div><div class="gp-a">'+esc(b.author)+'</div></div></div>';
    }
    var ID_KEY = "wellred_nov_id";
    if (read(ID_KEY)) {
      h += '<div class="gotit-form"><div class="gf-k">You&rsquo;re on the list</div><p>We&rsquo;ll email you the winner.</p></div>';
    } else {
      h += '<div class="gotit-form"><div class="gf-k">Get the winner in your inbox</div>'
        + '<p>Leave your name and email and we&rsquo;ll send you the November pick when the vote closes, plus first crack at tickets.</p>'
        + '<div class="gf-row"><input type="text" data-id="name" autocomplete="name" placeholder="Name">'
        + '<input type="email" data-id="email" autocomplete="email" inputmode="email" placeholder="you@email.com"></div>'
        + '<button class="gf-btn" data-idsend>Add me</button><div class="gf-msg"></div></div>';
    }
    h += stdBlock();
    h += '<div class="gotit-acts"><button class="gotit-btn" data-back>Back to the ballot</button>'
      + '<button class="linky" data-goform>Tell us what you think</button></div>';
    h += '<p class="gotit-note">Change your mind? Tap another cover on the ballot. Voting closes Halloween at midnight.</p>';
    h += '</div>';
    app.innerHTML = h;
    var back = app.querySelector("[data-back]");
    if (back) back.addEventListener("click", function(){ justVoted = false; render(); window.scrollTo(0,0); });
    var idb = app.querySelector("[data-idsend]");
    if (idb) idb.addEventListener("click", function(){
      var name = (app.querySelector('[data-id="name"]')||{}).value || "";
      var email = (app.querySelector('[data-id="email"]')||{}).value || "";
      var msg = app.querySelector(".gf-msg");
      name = name.trim(); email = email.trim();
      if (!email || email.indexOf("@") < 1) { if (msg) msg.textContent = "Add an email first."; return; }
      var picked = null; BOOKS.forEach(function(x){ if (x.id === mine) picked = x; });
      idb.disabled = true; idb.textContent = "Adding\u2026";
      post({action:"feedback", entry:{name:name, email:email, vote: picked ? picked.title : ""}}).then(function(){
        store(ID_KEY, "1");
        var box = idb.closest(".gotit-form");
        if (box) box.innerHTML = '<div class="gf-k">You&rsquo;re on the list</div><div class="gf-done">Thanks' + (name ? ", " + esc(name.split(" ")[0]) : "") + '. We&rsquo;ll email you the winner.</div>';
      }).catch(function(){
        idb.disabled = false; idb.textContent = "Add me";
        if (msg) msg.textContent = "That didn't send. Check your signal and try again.";
      });
    });
    var go = app.querySelector("[data-goform]");
    if (go) go.addEventListener("click", function(){
      justVoted = false; render();
      var sec = app.querySelector("#fbsec"); if (sec) sec.scrollIntoView({behavior:"smooth",block:"start"});
    });
  }

  function renderThanks(){
    app.innerHTML = '<div class="thanks">'
      + '<img class="thanks-script" src="/thanks-script.png" alt="Thank you! We appreciate the feedback">'
      + '<img class="thanks-cat" src="/thanks-cat.gif" alt="">'
      + '<p class="thanks-sub">Your notes are with Meg and Kaitlyn. We&rsquo;ll announce the winner when voting closes.</p>'
      + '<button class="linky" data-back>Back to the ballot</button>'
      + "</div>";
    var b = app.querySelector("[data-back]");
    if (b) b.addEventListener("click", function(){ justSent = false; render(); window.scrollTo(0,0); });
  }

  var keep = {f:{}, chips:{}};
  function snapshot(){
    app.querySelectorAll("[data-f]").forEach(function(el){ keep.f[el.getAttribute("data-f")] = el.value; });
    app.querySelectorAll("[data-pick]").forEach(function(g){
      var c=g.querySelector('.chip[aria-pressed="true"]');
      keep.chips[g.getAttribute("data-pick")] = c ? c.getAttribute("data-val") : "";
    });
  }
  function restore(){
    app.querySelectorAll("[data-f]").forEach(function(el){
      var k=el.getAttribute("data-f"); if (keep.f[k]) el.value = keep.f[k];
    });
    app.querySelectorAll("[data-pick]").forEach(function(g){
      var want = keep.chips[g.getAttribute("data-pick")]; if(!want) return;
      g.querySelectorAll(".chip").forEach(function(c){ c.setAttribute("aria-pressed", c.getAttribute("data-val")===want ? "true":"false"); });
    });
  }
  var CLOSES = new Date("2026-11-01T00:00:00-04:00");
  function closed(){ return Date.now() >= CLOSES.getTime(); }
  var FBLINK = /^#feedback/.test(location.hash||"");
  var fbScrolled = false;
  function render(){
    if (justSent) { renderThanks(); return; }
    if (justVoted) { renderGotIt(); return; }
    snapshot();
    var mine = read(VOTE_KEY), voted = !!mine, h = "";
    h += '<header class="mast">';
    h += '<div class="hero"><img src="' + HERO + '" alt=""></div>';
    h += '<div class="wrap"><div class="lockup">';
    h += '<div class="wordmark">Well<b>Red</b></div>';
    h += '<div class="founders">Founded by Kaitlyn <i>&amp;</i> Meg</div></div>';
    h += '<div class="mast-rule"></div>';
    h += '<div class="kick">the november ballot</div>';
    if (closed()) {
      h += "<h1>Voting is <i>closed</i></h1>";
      h += '<p class="sub">The November vote closed on Halloween. Follow <a href="https://www.instagram.com/thewellredclub/" target="_blank" rel="noopener noreferrer">@thewellredclub</a> for the winner.</p></div></header>';
    } else {
      h += voted ? "<h1>Your <i>pick</i> is in</h1>" : "<h1>Pick the <i>November</i> read</h1>";
      h += '<p class="sub">' + (voted
        ? "Tap another cover if you change your mind. Voting closes Halloween at midnight."
        : "Four contenders. Flip any one to see what it&rsquo;s about, then vote. Voting closes Halloween at midnight.") + "</p></div></header>";
    }

    h += '<main class="wrap"><div class="ballot">';
    BOOKS.forEach(function(b){
      var isMine = mine === b.id, isFlip = !!flipped[b.id];
      h += '<article class="card' + (isMine?" mine":"") + (isFlip?" flipped":"") + '" data-card="'+b.id+'"><div class="card-in">';
      h += '<div class="face front"' + (isFlip?' aria-hidden="true"':"") + '>';
      h += '<div class="cover"><img src="'+b.cover+'" alt="'+esc(b.title)+' cover"></div>';
      h += '<div class="meta"><h3 class="bk-title">'+esc(b.title)+'</h3><div class="bk-author">'+esc(b.author)+'</div>';
      h += '<div class="vibes">'+(b.vibes||[]).map(function(v,i){return '<span class="vibe'+(i===0?' genre':'')+'">'+esc(v)+'</span>';}).join('')+'</div>';
      h += '<div class="acts">';
      h += closed() ? (isMine ? '<span class="vote picked">Your pick &#9733;</span>' : '')
         : isMine ? '<span class="vote picked">Your pick &#9733;</span>'
                  : '<button class="vote" data-vote="'+b.id+'">Vote</button>';
      h += '<button class="flip" data-flip="'+b.id+'">What&rsquo;s it about</button></div></div></div>';
      h += '<div class="face back"' + (isFlip?"":' aria-hidden="true"') + '>';
      h += '<h3 class="bk-title">'+esc(b.title)+'</h3><p class="syn">'+esc(b.syn)+'</p>';
      h += '<a class="fable" href="'+esc(b.fable)+'" target="_blank" rel="noopener noreferrer">Open on Fable &#8599;</a>';
      h += '<div class="acts">';
      h += closed() ? (isMine ? '<span class="vote picked">Your pick &#9733;</span>' : '')
         : isMine ? '<span class="vote picked">Your pick &#9733;</span>'
                  : '<button class="vote" data-vote="'+b.id+'">Vote</button>';
      h += '<button class="flip" data-flip="'+b.id+'">Back to cover</button></div></div>';
      h += "</div></article>";
    });
    h += "</div>";

    if (voted && !closed()) h += stdBlock();
    if (voted && !closed() && !read(FB_KEY)) {
      h += '<div class="nudge"><div class="nudge-k">vote counted</div>'
        + "<p>One more thing while you&rsquo;re here. A few quick questions, all optional.</p>"
        + '<button class="nudge-btn" data-goform>Tell us what you think</button></div>';
    }
    if ((voted || FBLINK) && !closed()) h += read(FB_KEY) ? doneBlock() : formBlock();
    h += "</main>";
    h += '<footer class="wrap"><span>Well Red Club</span><span>Fort Lauderdale, FL</span></footer>';
    app.innerHTML = h;
    restore();
    wire();
    fitWordmark();
    if (FBLINK && !fbScrolled) { fbScrolled = true; var fs = app.querySelector("#fbsec") || app.querySelector(".done"); if (fs) setTimeout(function(){ fs.scrollIntoView({block:"start"}); }, 60); }
  }

  function doneBlock(){
    return '<section class="sec"><div class="done">'
      + '<div class="big">Thanks, that&rsquo;s<br>the good stuff</div>'
      + "<p>Your notes are with us.</p>"
      + '<button class="linky" data-again>Add more notes</button></div></section>';
  }
  function field(name,label,hint){
    return '<div class="field q"><div class="label">'+label+'<div class="hint">'+hint+'</div></div>'
      + '<textarea data-f="'+name+'" rows="2"></textarea></div>';
  }
  function chips(key,label,hint,opts){
    var h='<div class="field q"><div class="label">'+label+(hint?'<div class="hint">'+hint+'</div>':"")+'</div><div class="chips" data-pick="'+key+'">';
    opts.forEach(function(s){h+='<button type="button" class="chip" data-val="'+esc(s)+'" aria-pressed="false">'+esc(s)+'</button>';});
    return h+"</div></div>";
  }
  function formBlock(){
    var h='';
    h+='<section class="sec" id="fbsec" style="margin-top:34px"><div class="fb-kick">after class</div><div class="sec-head"><h2>Tell us the rest</h2><span class="sec-line"></span></div>';
    h+='<p class="sec-note">All optional. Skip anything you don&rsquo;t feel like answering.</p>';
    h+=chips("found","How did you hear about us?","",SOURCES);
    h+=field("classfb","How was the crochet class?","Be honest, we&rsquo;re planning the next one");
    h+=chips("nextact","What activity should we do next?","Pick the one you&rsquo;d sign up for first",NEXTACT);
    h+=field("activity","Anything else you&rsquo;d want to try?","Name it, we&rsquo;ll look into it");
    h+=chips("daytime","What day and time works best?","",DAYTIME);
    h+='<div class="field free"><div class="free-k">coming up</div><div class="free-t">The next two meetups are free</div>'
      + '<p>Here&rsquo;s what we&rsquo;re thinking. Which would you come to?</p><div class="chips" data-pick="freeevent">';
    FREEEV.forEach(function(s){h+='<button type="button" class="chip" data-val="'+esc(s)+'" aria-pressed="false">'+esc(s)+'</button>';});
    h+='</div></div>';
    h+=field("improve","What would you change?","Be honest, it&rsquo;s how this gets better");
    h+=field("spot","Where should we meet next?","A bar, a shop, a patio, name names");
    h+=field("books","Books we should be reading","Anything you&rsquo;ve been pushing on people");
    h+='<div class="sec-head" style="margin-top:38px"><h2>A little about you</h2><span class="sec-line"></span></div>';
    h+='<p class="sec-note">Helps us plan meetups people can actually get to. Leave any of it blank.</p>';
    h+='<div class="field"><div class="row2">'
      + '<div><div class="label">Name</div><input type="text" data-f="name" autocomplete="name" placeholder="First name is fine"></div>'
      + '<div><div class="label">City</div><input type="text" data-f="city" autocomplete="address-level2" placeholder="Fort Lauderdale, Plantation&hellip;"></div></div></div>';
    h+='<div class="field"><div class="label">Email<div class="hint">Only if you want the newsletter and first crack at tickets</div></div>'
      + '<input type="email" data-f="email" autocomplete="email" inputmode="email" placeholder="you@email.com"></div>';
    h+=chips("age","Age range","",AGES).replace('class="field q"','class="field"');
    h+='<button class="cta" data-send>Send it</button>';
    h+='<p class="note">Goes to Meg and Kaitlyn. Nothing here is required, including your name.</p></section>';
    return h;
  }
  function wire(){
    app.querySelectorAll("[data-vote]").forEach(function(el){
      el.addEventListener("click",function(){castVote(el.getAttribute("data-vote"))});
    });
    app.querySelectorAll("[data-flip]").forEach(function(el){
      el.addEventListener("click",function(){
        var id=el.getAttribute("data-flip");
        flipped[id]=!flipped[id];
        var card=app.querySelector('[data-card="'+id+'"]');
        if(card){card.classList.toggle("flipped",flipped[id]);
          card.querySelector(".front").setAttribute("aria-hidden",flipped[id]?"true":"false");
          card.querySelector(".back").setAttribute("aria-hidden",flipped[id]?"false":"true");}
      });
    });
    app.querySelectorAll("[data-pick]").forEach(function(g){
      g.querySelectorAll(".chip").forEach(function(c){
        c.addEventListener("click",function(){
          var on=c.getAttribute("aria-pressed")==="true";
          g.querySelectorAll(".chip").forEach(function(o){o.setAttribute("aria-pressed","false")});
          c.setAttribute("aria-pressed",on?"false":"true");
        });
      });
    });
    var go=app.querySelector("[data-goform]");
    if(go)go.addEventListener("click",function(){
      var s=app.querySelector("#fbsec");
      if(s)s.scrollIntoView({behavior:"smooth",block:"start"});
    });
    var send=app.querySelector("[data-send]");
    if(send)send.addEventListener("click",sendFeedback);
    var again=app.querySelector("[data-again]");
    if(again)again.addEventListener("click",function(){store(FB_KEY,"");render()});
  }

  function castVote(id){
    var prev=read(VOTE_KEY);
    if(prev===id)return;
    store(VOTE_KEY,id);
    justVoted = true;
    render();
    window.scrollTo(0,0);
    post({action:"vote",id:id,previous:prev||null}).catch(function(){
      justVoted = false;
      store(VOTE_KEY,prev||"");
      if(!prev){try{localStorage.removeItem(VOTE_KEY)}catch(e){}}
      render();
      var n=document.createElement("p");n.className="note";
      n.textContent="That vote didn't reach us. Check your signal and tap again.";
      app.querySelector(".ballot").after(n);
    });
  }

  function sendFeedback(){
    var entry={};
    app.querySelectorAll("[data-pick]").forEach(function(g){
      var c=g.querySelector('.chip[aria-pressed="true"]');
      entry[g.getAttribute("data-pick")]=c?c.getAttribute("data-val"):"";
    });
    app.querySelectorAll("[data-f]").forEach(function(el){
      entry[el.getAttribute("data-f")]=el.value.trim();
    });
    var any=Object.keys(entry).some(function(k){return entry[k]});
    var btn=app.querySelector("[data-send]");
    if(!any){
      var n=app.querySelector(".note");
      if(n)n.textContent="Add a note first, then send.";
      return;
    }
    if(btn){btn.disabled=true;btn.textContent="Sending\u2026";}
    post({action:"feedback",entry:entry}).then(function(){
      store(FB_KEY,"1");keep={f:{},chips:{}};justSent=true;render();window.scrollTo(0,0);
    }).catch(function(){
      if(btn){btn.disabled=false;btn.textContent="Send it";}
      var n=app.querySelector(".note");
      if(n)n.textContent="That didn't send. Check your signal and try again.";
    });
  }

  render();

})();
</script>
</body>
</html>
